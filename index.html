<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办事项</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --success: #10b981;
        --shadow: 0 10px 30px rgba(79, 70, 229, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 30px 28px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
        text-align: center;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      button {
        border: none;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 14px 20px;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .todo-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      .todo-actions button {
        padding: 8px 12px;
        font-size: 0.875rem;
      }

      .complete-btn {
        background: var(--success);
      }

      .delete-btn {
        background: #ef4444;
      }

      .todo-item.completed .todo-text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .todo-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
      }

      .todo-item::before {
        content: "✓";
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.12);
        color: var(--success);
        font-weight: bold;
        font-size: 0.8rem;
      }

      .todo-text {
        flex: 1;
        font-size: 1rem;
        word-break: break-word;
      }

      .empty {
        text-align: center;
        padding: 18px 12px;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 12px;
        background: #fafafa;
      }

      @media (max-width: 520px) {
        .container {
          padding: 22px 18px;
        }

        .input-row {
          flex-direction: column;
        }

        #addBtn {
          width: 100%;
        }

        .todo-item {
          align-items: flex-start;
          flex-wrap: wrap;
        }

        .todo-actions {
          width: 100%;
          justify-content: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>待办事项</h1>

      <div class="input-row">
        <input id="todoInput" type="text" placeholder="请输入待办事项" />
        <button id="addBtn">添加</button>
      </div>

      <ul id="todoList" class="todo-list"></ul>
    </div>

    <script>
      const API_URL = 'http://127.0.0.1:8000/todos';
      const todoList = document.getElementById('todoList');
      const todoInput = document.getElementById('todoInput');
      const addBtn = document.getElementById('addBtn');

      async function loadTodos() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) {
            throw new Error('获取数据失败');
          }

          const data = await response.json();
          const todos = data.todos || [];
          renderTodos(todos);
        } catch (error) {
          todoList.innerHTML = '<li class="empty">加载失败，请检查后端服务是否启动。</li>';
          console.error(error);
        }
      }

      function renderTodos(todos) {
        if (!todos.length) {
          todoList.innerHTML = '<li class="empty">暂无待办事项</li>';
          return;
        }

        todoList.innerHTML = todos
          .map((todo) => `
            <li class="todo-item${todo.completed ? ' completed' : ''}">
              <span class="todo-text">${escapeHtml(todo.content)}</span>
              <div class="todo-actions">
                <button
                  class="complete-btn"
                  type="button"
                  data-action="complete"
                  data-id="${todo.id}"
                  ${todo.completed ? 'disabled' : ''}
                >
                  ${todo.completed ? '已完成' : '完成'}
                </button>
                <button
                  class="delete-btn"
                  type="button"
                  data-action="delete"
                  data-id="${todo.id}"
                >
                  删除
                </button>
              </div>
            </li>
          `)
          .join('');
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function addTodo() {
        const content = todoInput.value.trim();
        if (!content) {
          alert('请输入待办事项');
          todoInput.focus();
          return;
        }

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ content }),
          });

          if (!response.ok) {
            throw new Error('添加失败');
          }

          const data = await response.json();
          console.log(data);
          todoInput.value = '';
          await loadTodos();
        } catch (error) {
          alert('添加失败，请稍后重试');
          console.error(error);
        }
      }

      async function updateTodo(todoId, method) {
        try {
          const response = await fetch(`${API_URL}/${todoId}`, { method });
          if (!response.ok) {
            throw new Error(`${method} 请求失败`);
          }

          await loadTodos();
        } catch (error) {
          alert(method === 'PUT' ? '完成失败，请稍后重试' : '删除失败，请稍后重试');
          console.error(error);
        }
      }

      addBtn.addEventListener('click', addTodo);

      todoList.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }

        const method = button.dataset.action === 'complete' ? 'PUT' : 'DELETE';
        updateTodo(button.dataset.id, method);
      });

      todoInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          addTodo();
        }
      });

      loadTodos();
    </script>
  </body>
</html>
